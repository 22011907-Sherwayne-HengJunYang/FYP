<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Coupon!</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
    <script src="/bootstrap/js/bootstrap.min.js"></script>
</head>
<style>
  body {
    background-image: url("/images/hero_1.jpg");
  }
</style>

<body>
    <div class="container">
		<div th:replace="fragment/header"></div>
					<br>
					<br>
					<br>
        <h1>Add Coupon</h1>

        <form th:action="@{/coupons/save}" method="post" th:object="${coupon}">
            <!-- Vendor Dropdown -->
            <div class="form-group">
                <label for="vendor">Vendor</label>
                <select class="form-control" id="vendor" name="vendor" th:field="*{vendor}" required>
                    <option th:each="vendor : ${venList}" th:value="${vendor.vendorID}" th:text="${vendor.name}"></option>
                </select>
            </div>
            
            <!-- Status Field -->
            <div class="form-group">
                <label for="status">Status</label>
                <select class="form-control" id="status" name="status" th:field="*{status}">
                    <option th:value="true" th:text="Available"></option>
                    <option th:value="false" th:text="Redeemed"></option>
                </select>
            </div>
            
            <!-- Quantity Field -->
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" class="form-control" id="quantity" name="quantity" th:field="*{quantity}" required>
            </div>

            <!-- Description Field -->
            <div class="form-group">
                <label for="description">Description</label>
                <textarea class="form-control" id="description" name="description" th:field="*{description}" rows="3" minlength="10" required></textarea>
                <div class="invalid-feedback">Description must be at least 10 characters long.</div>
            </div>

            <!-- Submit and Cancel Buttons -->
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/coupons" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>

</html>
