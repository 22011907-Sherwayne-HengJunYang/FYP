<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Coupon</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
    <script src="/bootstrap/js/bootstrap.min.js"></script>
</head>
<style>
  body {
    background-image: url("/images/hero_1.jpg");
  }
</style>
<body>
    <div class="container">
		<div th:replace="fragment/header"></div>
			<br>
			<br>
			<br>

<body>
    <div class="container">
        <h1>Edit Coupon</h1>

        <form th:action="@{/coupons/edit/{id}(id=${coupon.id})}" method="post" th:object="${coupon}">
            <!-- Vendor Dropdown -->
            <div class="form-group">
                <label for="vendor">Vendor</label>
                <select class="form-control" id="vendor" name="vendor" th:field="*{vendor}" required>
                    <option th:each="vendor : ${venList}" th:value="${vendor.vendorID}" th:text="${vendor.name}"></option>
                </select>
            </div>
            

            
            <!-- Quantity Field -->
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" class="form-control" id="quantity" name="quantity" th:field="*{quantity}" required>
            </div>
			<div class="form-group">
			               <label for="expiryDate">Expiry Date</label>
			               <input type="date" class="form-control" id="expiryDate" name="expiryDate" th:field="*{expiryDate}" required>
			           </div>
            
            <!-- Submit and Cancel Buttons -->
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/coupons" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>

</html>
