<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redeem Coupon</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
    <script src="/bootstrap/js/bootstrap.min.js"></script>
</head>
<style>
  body {
        background-color: #d2b48c !important; /* Darker beige */
        background-size: cover;
        background-position: center center;
        background-repeat: repeat-y; /* Repeat vertically */
        background-attachment: fixed; /* Fixed background */
        background-blend-mode: multiply; /* Blend the background image with the color */
      }
</style>
<body>
    <div class="container">
		<div th:replace="fragment/header"></div>
			<br>
			<br>
			<br>
        <h1>Redeem Coupon</h1>

        <!-- Display message if available -->
        <div th:if="${message}" th:text="${message}" class="alert alert-info"></div>

        <form th:action="@{/redeemCode}" method="post">
            <!-- Redeem Code Field -->
            <div class="form-group">
                <label for="redeemCode">Redeem Code:</label>
                <input type="text" class="form-control" id="redeemCode" name="redeemCode" required>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary">Redeem</button>
        </form>

        <!-- Cancel Button -->
        <a href="/coupons" class="btn btn-secondary">Cancel</a>
    </div>
</body>
</html>
