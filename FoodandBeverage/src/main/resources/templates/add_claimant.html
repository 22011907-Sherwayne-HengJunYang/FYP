<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Couponify - Add New Claimant!</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <style>
        body {
            background-color: #d2b48c !important; /* Darker beige */
            background-size: cover;
            background-position: center center;
            background-repeat: repeat-y; /* Repeat vertically */
            background-attachment: fixed; /* Fixed background */
            background-blend-mode: multiply; /* Blend the background image with the color */
        }
        .content-container {
            margin-top: 70px;
        }
    </style>
</head>
<body>
    <div class="container content-container">
        <div th:replace="fragment/header"></div>
        <h2 class="text-center">Add New Claimant</h2>
        <form class="needs-validation" novalidate th:action="@{/claimants/save}" method="post" th:object="${claimant}" onsubmit="return validateForm()">
            <div class="form-row justify-content-center">
                <div class="form-group col-md-6">
                    <label for="claimant_name">Name:</label>
                    <input id="claimant_name" type="text" class="form-control" th:field="*{name}" required pattern="^[A-Za-z\s]+$" />
                    <div class="invalid-feedback">Please enter a valid name (letters only).</div>
                </div>
            </div>
            <div class="form-row justify-content-center">
                <div class="form-group col-md-6">
                    <label for="claimant_username">Username:</label>
                    <input id="claimant_username" type="text" class="form-control" th:field="*{username}" required minlength="4" />
                    <div class="invalid-feedback">Username must be at least 4 characters long.</div>
                </div>
            </div>
            <div class="form-row justify-content-center">
                <div class="form-group col-md-6">
                    <label for="claimant_email">Email:</label>
                    <input id="claimant_email" type="email" class="form-control" th:field="*{email}" required />
                    <div class="invalid-feedback">Please enter a valid email address.</div>
                </div>
            </div>
            <div class="form-row justify-content-center">
                <div class="form-group col-md-6">
                    <label for="claimant_password">Password:</label>
                    <input id="claimant_password" type="password" class="form-control" th:field="*{password}" required pattern="^(?=.*[A-Z])(?=.*\d).+$" />
                    <div class="invalid-feedback">Password must contain at least 1 uppercase letter and 1 number.</div>
                </div>
            </div>
            <div class="form-row justify-content-center">
                <div class="form-group col-md-6">
                    <button type="submit" class="btn btn-primary save-button">Save</button>
                </div>
            </div>
        </form>
    </div>

    <script>
        'use strict'

        // Fetch the form element
        var form = document.querySelector('.needs-validation')

        // Add a submit event listener to the form
        form.addEventListener('submit', function(event) {
            if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
            }

            form.classList.add('was-validated')
        })

        function validateForm() {
            var nameField = document.getElementById('claimant_name');
            var usernameField = document.getElementById('claimant_username');
            var emailField = document.getElementById('claimant_email');
            var passwordField = document.getElementById('claimant_password');

            var namePattern = /^[A-Za-z\s]+$/;
            var passwordPattern = /^(?=.*[A-Z])(?=.*\d).+$/;

            var valid = true;

            if (!namePattern.test(nameField.value)) {
                nameField.setCustomValidity('Invalid');
                nameField.classList.add('is-invalid');
                valid = false;
            } else {
                nameField.setCustomValidity('');
                nameField.classList.remove('is-invalid');
            }

            if (usernameField.value.length < 4) {
                usernameField.setCustomValidity('Invalid');
                usernameField.classList.add('is-invalid');
                valid = false;
            } else {
                usernameField.setCustomValidity('');
                usernameField.classList.remove('is-invalid');
            }

            if (!emailField.value.includes('@')) {
                emailField.setCustomValidity('Invalid');
                emailField.classList.add('is-invalid');
                valid = false;
            } else {
                emailField.setCustomValidity('');
                emailField.classList.remove('is-invalid');
            }

            if (!passwordPattern.test(passwordField.value)) {
                passwordField.setCustomValidity('Invalid');
                passwordField.classList.add('is-invalid');
                valid = false;
            } else {
                passwordField.setCustomValidity('');
                passwordField.classList.remove('is-invalid');
            }

            return valid;
        }
    </script>
</body>
</html>
