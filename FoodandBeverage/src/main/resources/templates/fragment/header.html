<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
    <script src="/bootstrap/js/bootstrap.js"></script>
    <style>
        .navbar-scroll .nav-link,
        .navbar-scroll .navbar-toggler-icon,
        .navbar-scroll .navbar-brand {
            color: #fff;
        }

        .navbar-scrolled .nav-link,
        .navbar-scrolled .navbar-toggler-icon,
        .navbar-scrolled .navbar-brand {
            color: #fff;
        }

        .navbar-scroll,
        .navbar-scrolled {
            background-color: #cbbcb1;
        }

        .mask-custom {
            backdrop-filter: blur(5px);
            background-color: rgba(255, 255, 255, .15);
        }

        .navbar-brand {
            font-size: 1.75rem;
            letter-spacing: 3px;
            margin-right: 2rem;
        }

        .btn-nav {
            background: none;
            border: 1px solid #fff;
            color: #fff;
            padding: 0.375rem 0.75rem;
            margin: 0 0.25rem;
            border-radius: 0.25rem;
            transition: background-color 0.3s, color 0.3s;
        }

        .btn-nav:hover {
            background-color: #fff;
            color: #5e9693;
        }

        .btn-logout {
            background: none;
            border: 1px solid #fff;
            color: #fff;
            padding: 0.375rem 0.75rem;
            cursor: pointer;
            border-radius: 0.25rem;
            transition: background-color 0.3s, color 0.3s;
        }

        .btn-logout:hover {
            background-color: #fff;
            color: #5e9693;
        }

        .navbar-nav {
            width: 100%;
        }

        .logout-container {
            margin-left: auto;
        }
    </style>
</head>
<body>
    <header>
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light fixed-top mask-custom shadow-0">
            <a class="navbar-brand" href="/"><span style="color: #5e9693;">Coupo</span><span style="color: #fff;">nify</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <i class="fas fa-bars"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav">
                    <li class="nav-item" sec:authorize="hasRole('Admin')">
                        <a class="btn btn-nav" th:href="@{/vendors}">Vendors</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('Admin')">
                        <a class="btn btn-nav" th:href="@{/vendors/add}">Add Vendors</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('Issuer','Vendor','Admin')">
                        <a class="btn btn-nav" th:href="@{/coupons}">AllCoupons</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-nav" th:href="@{/publicCoupons}">Coupons</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('Vendor')">
                        <a class="btn btn-nav" th:href="@{/coupons/add}">Add Coupons</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('Admin')">
                        <a class="btn btn-nav" th:href="@{/claimants}">Claimants</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('Admin')">
                        <a class="btn btn-nav" th:href="@{/claimants/add}">Add Claimants</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('Admin')">
                        <a class="btn btn-nav" th:href="@{/issuer}">Issuer</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('Admin')">
                        <a class="btn btn-nav" th:href="@{/issuer/add}">Add Issuer</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('Claimant')">
                        <a class="btn btn-nav" th:href="@{/Inventory}">Inventory</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('Vendor')">
                        <a class="btn btn-nav" th:href="@{/redeem}">Redeem!</a>
                    </li>
					<li class="nav-item" sec:authorize="hasRole('Vendor')">
                    <a class="btn btn-nav" th:href="@{/graph}">Visualizations</a>
                    </li>
                    
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="btn btn-nav" href="/login">Login</a>
                    </li>
                    <li class="nav-item logout-container" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button class="btn-logout" type="submit">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </nav>
    </header>
</body>
</html>
