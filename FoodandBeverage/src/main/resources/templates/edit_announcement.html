<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Edit Announcement</title>
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
  <script src="/bootstrap/js/bootstrap.js"></script>
</head>
<body>
  <div class="container">
    <h2>Edit Announcement</h2>
	<form th:action="@{/announcement/edit}" method="post">
	  <div class="form-group">
	    <label for="announcementText">Announcement Text</label>
	    <textarea id="announcementText" name="announcementText" class="form-control" rows="4" th:text="${announcementText}"></textarea>
	  </div>
	  <button type="submit" class="btn btn-primary mt-3">Save</button>
	</form>
  </div>
</body>
</html>
