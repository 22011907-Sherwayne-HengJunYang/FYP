<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Couponify - Inventory</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
    <style>
      body {
        background-image: url("/images/hero_1.jpg");
      }
      .pagination-controls {
        display: flex;
        justify-content: space-between; /* Distributes space between buttons */
        margin-top: 20px;
      }
      .pagination-links {
        display: flex;
        justify-content: center; /* Center-aligns the pagination links */
        margin-top: 20px;
      }
      .pagination-links a {
        margin: 0 5px; /* Adds space between page links */
      }
    </style>
</head>
<body>
    <div class="container">
        <div th:replace="fragment/header"></div>
        <br>
        <br>
        <main>
            <div class="row m-3">
                <div class="col text-center fs-3">Inventory</div>
            </div>
            <!-- Feedback messages -->
            <div th:if="${inventoryError}" class="alert alert-danger" th:text="${inventoryError}"></div>
            <div th:if="${orderSuccess}" class="alert alert-success" th:text="${orderSuccess}"></div>
            <div class="row m-3 border-top border-bottom fs-5">
                <div class="col">Coupon ID</div>
                <div class="col">Expiry Date</div>
                <div class="col">Description</div>
                <div class="col">Vendor</div>
                <div class="col">Status</div>
                <div class="col">Redeem Code</div>
            </div>
            <div class="row m-3" th:each="orderCoupon : ${listOrders}">
                <div class="col" th:text="${orderCoupon.coupon.id}"></div>
                <div class="col" th:text="${orderCoupon.coupon.expiryDate}"></div>
                <div class="col" th:text="${orderCoupon.coupon.description}"></div>
                <div class="col" th:text="${orderCoupon.coupon.vendor.name}"></div>
                <div class="col" th:text="${orderCoupon.status ? 'Available' : 'Redeemed'}"></div>
                <div class="col" th:text="${orderCoupon.redeemCode}"></div>
            </div>
            <!-- Pagination Controls -->
            <div class="pagination-controls">
                <!-- Previous Button -->
                <a th:href="@{/Inventory(page=${page.number - 1}, size=${page.size})}" class="btn btn-secondary" th:if="${page.hasPrevious()}">Previous</a>
                <!-- Next Button -->
                <a th:href="@{/Inventory(page=${page.number + 1}, size=${page.size})}" class="btn btn-secondary" th:if="${page.hasNext()}">Next</a>
            </div>
            <!-- Pagination Links -->
            <div class="pagination-links">
                <a th:each="i : ${#numbers.sequence(1, totalPages)}" 
                   th:href="@{/Inventory(page=${i - 1}, size=${page.size})}" 
                   th:text="${i}" 
                   th:classappend="${i == page.number + 1} ? 'btn btn-primary' : 'btn btn-outline-primary'"></a>
            </div>
        </main>
        <div th:replace="fragment/footer"></div>
    </div>
</body>
</html>
