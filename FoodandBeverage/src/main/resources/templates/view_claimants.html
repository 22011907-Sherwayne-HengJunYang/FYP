<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Coupon - View Claimants!</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Make sure to include jQuery before Bootstrap's JavaScript -->
</head>
<style>
     body {
            background-color: #d2b48c !important; /* Darker beige */
            background-size: cover;
            background-position: center center;
            background-repeat: repeat-y;
            background-attachment: fixed;
        }
    .content-container {
        margin-top: 20px; /* Adjust the value as needed */
    }
</style>
<body>
    <div class="container content-container">
        <div th:replace="fragment/header"></div>
        <div class="py-5 text-center">
            <h2>View Claimants</h2>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered">
                <thead class="thead-dark">
                    <tr>
                        <th>Claimant ID</th>
                        <th>Name</th>
                        <th>Username</th>
                        <th>Email</th>
                        <!-- Add more columns as needed -->
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Loop through each claimant in the list -->
                    <th:block th:each="claimant : ${listClaimants}">
                        <tr>
                            <td th:text="${claimant.id}"></td>
                            <td th:text="${claimant.name}"></td>
                            <td th:text="${claimant.username}"></td>
                            <td th:text="${claimant.email}"></td>
                            <!-- Add more columns as needed -->
                            <td>
                                <!-- Edit claimant link -->
                                <a class="btn btn-primary btn-sm" th:href="@{/claimants/edit/{id}(id=${claimant.id})}">Edit</a>
                                <!-- Delete claimant link (optional) -->
                                <a class="btn btn-danger btn-sm" th:href="@{/claimants/delete/{id}(id=${claimant.id})}" onclick="return confirm('Are you sure you want to delete this claimant?')">Delete</a>
                            </td>
                        </tr>
                    </th:block>
                </tbody>
            </table>
        </div>
    </div>
	   <!-- Pagination -->
	   <nav aria-label="Page navigation">
	       <ul class="pagination justify-content-center">
	           <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
	               <a class="page-link" th:href="@{/claimants(page=${currentPage - 1})}" aria-label="Previous">
	                   <span aria-hidden="true">&laquo;</span>
	               </a>
	           </li>
	           <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${i == currentPage} ? 'active'">
	               <a class="page-link" th:href="@{/claimants(page=${i})}" th:text="${i}">1</a>
	           </li>
	           <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
	               <a class="page-link" th:href="@{/claimants(page=${currentPage + 1})}" aria-label="Next">
	                   <span aria-hidden="true">&raquo;</span>
	               </a>
	           </li>
	       </ul>
	   </nav>
	</div>

    <footer class="footer bg-dark fixed-bottom">
        <div class="container text-center text-white">
            <div th:replace="fragment/footer"></div>
        </div>
    </footer>
</body>

</html>
