<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Coupon - Home</title>

  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
  <script src="/bootstrap/js/bootstrap.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      background-image: url("/images/hero_1.jpg");
      margin-top: 100px; /* Adjust as necessary to avoid overlap with the header */
    }

    .announcement-bar {
      background-color: #ffecb3;
      color: #d32f2f;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ffb74d;
      border-radius: 5px;
      position: relative;
      overflow: hidden;
    }

    .announcement-content {
		display: flex;
		     align-items: center;
		     justify-content: space-between;
		     position: relative;
		     overflow: hidden;
		     white-space: nowrap;
    }

	.announcement-text {
	    will-change: transform;
	    animation: slideLeft 15s linear infinite;
	    display: inline-block;
	    padding-left: 100%;
	    white-space: nowrap;
	}

	@keyframes slideLeft {
	    0% {
	        transform: translateX(0);
	    }
	    100% {
	        transform: translateX(-100%);
	    }
	}

    .edit-announcement {
      margin-left: 20px;
    }
  </style>
</head>

<body>
  <div th:replace="fragment/header"></div>
  <br>
  
  <div class="container">
    <div class="py-5 text-center">
      <div class="h1">Welcome to Couponify!</div>
	  <!-- Announcement Bar -->
	    <div class="container">
	      <div class="announcement-bar">
	        <div class="announcement-content">
	          <div class="announcement-text" th:text="${announcementText}">Announcement text goes here.</div>
	          <div sec:authorize="hasRole('Admin') or hasRole('Vendor')" class="edit-announcement">
	            <a href="/announcement/edit" class="btn btn-primary">Edit Announcement</a>
	          </div>
	        </div>
	      </div>
	    </div>
      <main>
        <div sec:authorize="isAuthenticated()">
          <h4 class="text-center">Hello <span sec:authentication="principal.username"></span>!</h4>
        </div>
        <div id="carouselExampleDark" class="carousel carousel-dark slide" data-bs-ride="carousel">
          <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="2" aria-label="Slide 3"></button>
          </div>
          <div class="carousel-inner">
            <div class="carousel-item active" data-bs-interval="5000">
              <img src="/images/Banner2.png" class="d-block w-100" alt="...">
              <div class="carousel-caption d-none d-md-block"></div>
            </div>
            <div class="carousel-item" data-bs-interval="5000">
              <img src="/images/Banner3.png" class="d-block w-100" alt="...">
              <div class="carousel-caption d-none d-md-block"></div>
            </div>
			<div class="carousel-item" data-bs-interval="5000">
              <img src="/images/Banner1.png" class="d-block w-100" alt="...">
              <div class="carousel-caption d-none d-md-block"></div>
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </main>
    </div>
  </div>
  <div th:replace="fragment/footer"></div>
</body>

</html>
