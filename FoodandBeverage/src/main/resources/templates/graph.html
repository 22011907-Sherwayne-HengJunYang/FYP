<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Power BI Report</title>
    <style>
        /* Optional: Add some basic styling */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
            background-color: #f4f4f4;
        }
        iframe {
            border: none;
        }
    </style>
</head>
<body>
    <h1>Power BI Report</h1>
    <iframe
        title="Test1"
        width="1140"
        height="541.25"
        src="https://app.powerbi.com/reportEmbed?reportId=582583cf-9f82-48f3-9f63-7a574fcd2bdd&autoAuth=true&ctid=f688b0d0-79f0-40a4-8644-35fcdee9d0f3"
        frameborder="0"
        allowFullScreen="true">
    </iframe>
</body>
</html>
